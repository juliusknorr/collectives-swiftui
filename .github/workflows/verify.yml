name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            .build/embedded-text
            Resources/EmbeddedText/vendor
            ~/.npm
          key: embedded-text-${{ runner.os }}-${{ hashFiles('Resources/EmbeddedText/text.lock.json', 'scripts/build-embedded-text.py') }}
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: node scripts/test-embedded-text.cjs
      - run: node scripts/test-text-startup-diagnostics.cjs
      - run: node scripts/test-text-resize-observer.cjs
      - name: Type-check Text handoff benchmark
        run: xcrun swiftc -typecheck scripts/benchmark-embedded-text.swift
      - run: make text-assets
      - name: Verify rich text at phone and desktop widths
        run: |
          xcrun swift scripts/test-embedded-text-webkit.swift Resources/EmbeddedText 390
          xcrun swift scripts/test-embedded-text-webkit.swift Resources/EmbeddedText 900
      - run: swift test
      - name: Build native Mac app
        run: xcodebuild -project Collectives.xcodeproj -scheme Collectives -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS app
        run: xcodebuild -project Collectives.xcodeproj -scheme Collectives -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s dev/tests -v
      - run: bash dev/setup.sh
      - run: python3 dev/seed.py
      - name: Verify real instance
        run: python3 dev/smoke.py
      - if: failure()
        run: docker compose -f dev/compose.yaml logs --tail=150
      - if: always()
        run: docker compose -f dev/compose.yaml down --volumes
